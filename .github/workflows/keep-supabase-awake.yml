name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days of inactivity.
# This workflow makes a tiny REST query daily to reset the timer.
# Daily (rather than near the 7-day edge) leaves a wide margin for any
# skipped or delayed run. Note: GitHub auto-disables scheduled workflows
# after 60 days of repo inactivity — re-enable from the Actions tab if so.

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC every day
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
