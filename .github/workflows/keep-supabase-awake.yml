name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days of inactivity.
# This workflow makes a tiny REST query every 6 days to reset the timer.
# Margin of 1 day absorbs any GitHub-side cron delay.

on:
  schedule:
    - cron: '0 6 */6 * *'   # 06:00 UTC every 6 days
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
